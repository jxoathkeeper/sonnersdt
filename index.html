<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CONNECTED.</title>
  <link rel="stylesheet" href="namegate/style.css">
</head>
<body class="name-gate-active">
  <section id="name-gate" aria-label="Connection name prompt">
    <div id="name-gate-connected" class="name-gate-screen">
      <div>CONNECTED.</div>
      <div>WELCOME BACK.</div>
    </div>
    <div id="name-gate-entry" class="name-gate-screen hidden">
      <div id="name-gate-label">ENTER YOUR NAME:</div>
      <div id="name-gate-value" aria-live="polite"></div>
    </div>
    <input id="name-gate-mobile-input" type="text" aria-label="Enter your name" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" tabindex="-1">
  </section>
  <script src="namegate/name-gate.js"></script>
</body>
</html>
